name: build-kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "base | sched_ext | btf_only | full"
        required: true
        default: base
      toolchain:
        description: "gcc | clang"
        required: true
        default: gcc

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev dwarves \
            clang lld llvm python3 git ca-certificates

      - name: Build pahole 1.29
        run: |
          set -euxo pipefail
          sudo apt-get install -y --no-install-recommends cmake libdw-dev
          git clone --depth 1 --branch v1.29 https://github.com/acmel/dwarves.git
          cmake -S dwarves -B dwarves/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build dwarves/build -j"$(nproc)"
          dwarves/build/pahole --version

      - name: Clone pinned kernel source
        run: |
          git init kernel
          git -C kernel remote add origin https://github.com/yzddmr6/linux-sm8750-piano
          git -C kernel fetch --depth 1 origin 5ed69822d95a564e9743c27c446107363ec6abd1
          git -C kernel checkout --detach FETCH_HEAD
          git -C kernel rev-parse HEAD

      - name: Configure kernel (${{ inputs.variant }})
        run: |
          set -euxo pipefail
          export ARCH=arm64 KBUILD_BUILD_USER=piano KBUILD_BUILD_HOST=builder
          if [ "${{ inputs.toolchain }}" = "clang" ]; then export LLVM=1; else export CROSS_COMPILE=aarch64-linux-gnu-; fi
          K="$PWD/kernel"; O="$PWD/out"; mkdir -p "$O"
          cp ci/release.config "$O/.config"
          sed -i 's/{ 1600, 3000 }/{ 3000, 3000 }/; s/{ 2500, 3000 }/{ 3000, 3000 }/' kernel/drivers/power/supply/xiaomi_mca.c
          case "${{ inputs.variant }}" in
            base) ;;
            sched_ext) "$K/scripts/config" --file "$O/.config" -e SCHED_CLASS_EXT -e BPF_JIT_ALWAYS_ON ;;
            btf_only)
              cat >> "$O/.config" <<'EOF'
          CONFIG_DEBUG_INFO=y
          CONFIG_DEBUG_INFO_DWARF5=y
          CONFIG_DEBUG_INFO_BTF=y
          EOF
              ;;
            full)
              cat >> "$O/.config" <<'EOF'
          CONFIG_DEBUG_INFO=y
          CONFIG_DEBUG_INFO_DWARF5=y
          CONFIG_SCHED_CLASS_EXT=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_CGROUP_BPF=y
          CONFIG_BPF_EVENTS=y
          CONFIG_FTRACE=y
          CONFIG_FUNCTION_TRACER=y
          CONFIG_FUNCTION_GRAPH_TRACER=y
          CONFIG_FTRACE_SYSCALLS=y
          CONFIG_DYNAMIC_FTRACE=y
          EOF
              ;;
            *) echo "unknown variant"; exit 1 ;;
          esac
          make -C "$K" O="$O" LOCALVERSION= olddefconfig
          grep -E 'CONFIG_SCHED_CLASS_EXT|CONFIG_DEBUG_INFO_BTF|CONFIG_DEBUG_INFO_NONE|CONFIG_LOCALVERSION=' "$O/.config" || true

      - name: Build Image, DTBs and modules
        run: |
          set -euxo pipefail
          export ARCH=arm64 KBUILD_BUILD_USER=piano KBUILD_BUILD_HOST=builder
          export PAHOLE="$PWD/dwarves/build/pahole"
          if [ "${{ inputs.toolchain }}" = "clang" ]; then
            export LLVM=1
          else
            export CROSS_COMPILE=aarch64-linux-gnu-
          fi
          K="$PWD/kernel"; O="$PWD/out"
          make -C "$K" O="$O" LOCALVERSION= -j"$(nproc)" \
            Image qcom/sm8750-xiaomi-piano.dtb qcom/sm8750-xiaomi-piano-desktop.dtb modules

      - name: Collect image
        run: |
          set -euxo pipefail
          mkdir -p image
          cp out/arch/arm64/boot/Image image/
          cp out/arch/arm64/boot/dts/qcom/sm8750-xiaomi-piano*.dtb image/
          cp out/.config image/config
          cat out/include/config/kernel.release > image/kernel-release
          ls -l image/

      - uses: actions/upload-artifact@v4
        with:
          name: piano-image-${{ inputs.variant }}
          path: image
          if-no-files-found: error

      - name: Package artifacts
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp "$PWD/out/arch/arm64/boot/Image" dist/
          cp "$PWD"/out/arch/arm64/boot/dts/qcom/sm8750-xiaomi-piano*.dtb dist/
          cp "$PWD/out/.config" dist/config
          cat "$PWD/out/include/config/kernel.release" > dist/kernel-release
          export ARCH=arm64
          if [ "${{ inputs.toolchain }}" = "clang" ]; then export LLVM=1; else export CROSS_COMPILE=aarch64-linux-gnu-; fi
          make -C kernel O="$PWD/out" LOCALVERSION= INSTALL_MOD_PATH="$PWD/dist/modules" INSTALL_MOD_STRIP=1 modules_install
          tar czf kernel-artifacts.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: piano-kernel-${{ inputs.variant }}
          path: kernel-artifacts.tar.gz
          compression-level: 0
          if-no-files-found: error
