name: build-scx-lavd

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "sched-ext/scx tag or branch"
        required: true
        default: v1.0.20
      rust:
        description: "Rust toolchain version"
        required: true
        default: stable

permissions:
  contents: read

jobs:
  scx:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libclang-dev libbpf-dev libelf-dev zlib1g-dev pkg-config build-essential git
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust }}
      - name: Clone sched-ext/scx (${{ inputs.ref }})
        run: git clone --depth 1 --branch "${{ inputs.ref }}" https://github.com/sched-ext/scx
      - name: Build scx_lavd
        run: |
          cd scx
          cargo build --release -p scx_lavd
          file target/release/scx_lavd
      - uses: actions/upload-artifact@v4
        with:
          name: scx-lavd-${{ inputs.ref }}
          path: scx/target/release/scx_lavd
          if-no-files-found: error
